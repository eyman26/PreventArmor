# PreventArmor Config
# Do /preventarmor reload to reload the config.
# made by - Eyman
# How much damage (in half-hearts) players take when wearing armor.
# Example: 2.0 = 1 heart. Use 0 for no damage (warning/removal only); it can't be negative.
# This damage ignores armor, enchantments and the Resistance effect.
damage-amount: 2.0

# Message shown in the action bar when armor is worn
warning-message: "&cArmor is forbidden!"

# Should the plugin also remove the armor instead of just damaging? (true/false)
remove-armor: false

# Refuse unauthorized armor outright instead of punishing it. The piece is moved straight
# back into the player's inventory the moment it is equipped (and on every check, which also
# catches armor put on by commands or worn while logging in). No damage is dealt in this mode.
block-equip: true

# Action bar message shown when block-equip takes a piece off
equip-denied-message: "&cYou are not allowed to wear that."

# How often to check (in ticks). 20 ticks = 1 second. Minimum is 1.
check-interval: 20

# If true, only the armor pieces listed below will be blocked.
# If false, ALL armor will be blocked.
block-specific: false

# List of specific armor to block (only works if block-specific is true).
blocked-armor:
  - DIAMOND_HELMET
  - NETHERITE_CHESTPLATE

# If enabled, armor items with a specific NBT tag will be ignored by the plugin.
# Example: an item with the tag "armor_exempt" = "true" will NOT be blocked.
# The key may only contain letters, digits and . _ - /
nbt-exempt:
  enabled: true
  key: "armor_exempt"
  value: "true"

# If enabled, armor items with a specific lore line will be ignored by the plugin.
# Matching is case-insensitive and ignores color codes.
# You can add multiple exempt lore lines below.
lore-exempt:
  enabled: true
  lines:
    - "ONLY NETHERITE ARMOR"

# ---------------------------------------------------------------------------------------------
# Who may wear blocked armor
# ---------------------------------------------------------------------------------------------
# Order of checks for a blocked, non-exempt piece:
#   1. preventarmor.bypass          -> always allowed
#   2. whitelist.enabled            -> players NOT on the whitelist are always refused
#   3. permissions.enabled          -> needs preventarmor.wear.<slot> or preventarmor.wear.<item>
#   4. otherwise                    -> allowed if the player passed the whitelist, refused if not

# Per-piece permissions. Nodes:
#   preventarmor.wear.head / chest / legs / feet     any blocked item in that slot
#   preventarmor.wear.<item id>                      e.g. preventarmor.wear.netherite_chestplate
permissions:
  enabled: false

# Strict whitelist: only these players (names or UUIDs) or holders of these permission nodes
# may wear blocked armor at all. Combine with permissions.enabled to also limit which pieces.
whitelist:
  enabled: false
  players: []
  permissions:
    - preventarmor.whitelisted
